name: HealthDuo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HealthDuo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: 恢复日记
        CFBundleName: HealthDuo
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSHealthShareUsageDescription: 读取睡眠、HRV、静息心率、心率与训练记录，用于计算每日恢复分。
        NSHealthUpdateUsageDescription: 仅在你主动保存时才会写入健康数据。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthduo
        INFOPLIST_FILE: Config/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: HealthDuoWatch
        embed: true

  HealthDuoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: Shared
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: 恢复日记
        CFBundleName: HealthDuoWatch
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.healthduo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthduo.watchkitapp
        INFOPLIST_FILE: Config/Watch-Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  HealthDuo:
    build:
      targets:
        HealthDuo: all
    run:
      config: Debug
    archive:
      config: Release
  HealthDuoWatch:
    build:
      targets:
        HealthDuoWatch: all
    run:
      config: Debug
